name = "sehat"
main = "worker.js"
compatibility_date = "2026-09-01"
# The dashboard pages send some functions to the browser as text, so the bundler must not wrap them in __name() helpers.
keep_names = false

[vars]
# The public address of the app (the GitHub Pages address), without a slash at the end.
# "Import from app" in /admin copies the book from <APP_URL>/content/book.json.
APP_URL = ""

[[d1_databases]]
binding = "DB"
database_name = "fhb"
database_id = "PASTE-THE-ID-FROM-wrangler-d1-create"

# Secrets (set with `wrangler secret put NAME`, never written here):
#   DASH_KEY           the owner's secret word for /dashboard, /admin and /people (other people get their own links from /people)
#   ANTHROPIC_API_KEY  optional, for the "Summarise feedback" button

# Daily clean-up at 03:17 UTC (server/usage.js cleanup): voice notes deleted 90 days after they arrive,
# raw events from old app versions deleted after 12 months, old upload ids and flood counters removed.
[triggers]
crons = ["17 3 * * *"]
