# Publishes the app to GitHub Pages (https://<user>.github.io/<repo>/) on every push to main.
name: Publish app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect the app files
        run: |
          mkdir site
          cp -r index.html manifest.webmanifest sw.js css js fonts img content site/
          [ -d anim ] && cp -r anim site/ && rm -f site/anim/demo.html || true   # explainer animations (js/anim.js plays them), with anim/cine/
          find site -name '*.cjs' -delete   # local screenshot helpers, not part of the app
          [ -d audio ] && cp -r audio site/ || true   # narration clips (about 65 MB per voice; phones download only their own voice)
          rm -f site/audio/*.json site/audio/*/*.json   # the voice tool's notes (tts-manifest.json, tts-usage.json), not part of the app
          rm -rf site/img/_preview site/content/src site/content/scripts site/js/sw.template.js
          touch site/.nojekyll
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
