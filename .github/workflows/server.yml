# Sets up and updates the stats, feedback and editor server on Cloudflare when server/ changes.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; optional DASH_KEY and ANTHROPIC_API_KEY.
name: Update server
on:
  push:
    branches: [main]
    paths: ["server/**", "js/overlay.js", ".github/workflows/server.yml"]
  workflow_dispatch:
# one deploy at a time: two pushes close together must not run the table update and the deploy at once
concurrency: { group: server, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # an exact wrangler version: a bundler change once broke the in-browser scripts (see wrangler.toml keep_names)
      W: wrangler@4.148.0
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22 }
      - name: Check the Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings > Secrets and variables > Actions, then run this again."; exit 1
          fi
      - name: Find or create the database
        run: |
          id=$(npx -y "$W" d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const d=JSON.parse(s).find(x=>x.name==="fhb");process.stdout.write(d?d.uuid:"")})')
          if [ -z "$id" ]; then npx -y "$W" d1 create fhb; id=$(npx -y "$W" d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).find(x=>x.name==="fhb").uuid))'); fi
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
          sed -i "s|^APP_URL = .*|APP_URL = \"https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}\"|" wrangler.toml
      - name: Create or update the tables
        run: npx -y "$W" d1 execute fhb --remote --file=schema.sql
      - name: Deploy
        run: npx -y "$W" deploy
      - name: Set secret words
        env:
          DASH_KEY: ${{ secrets.DASH_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # a failed put fails the step (it used to print "no secret yet" and pass)
          if [ -n "$DASH_KEY" ]; then
            printf %s "$DASH_KEY" | npx -y "$W" secret put DASH_KEY
          else
            echo "::warning::No DASH_KEY secret yet: add one in GitHub, then run this again."
          fi
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            printf %s "$ANTHROPIC_API_KEY" | npx -y "$W" secret put ANTHROPIC_API_KEY
          fi
