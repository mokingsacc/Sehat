# Sets up and updates the stats, feedback and editor server on Cloudflare when server/ changes.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; optional DASH_KEY and ANTHROPIC_API_KEY.
name: Update server
on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Check the Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings > Secrets and variables > Actions, then run this again."; exit 1
          fi
      - name: Find or create the database
        run: |
          id=$(npx -y wrangler@4 d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const d=JSON.parse(s).find(x=>x.name==="fhb");process.stdout.write(d?d.uuid:"")})')
          if [ -z "$id" ]; then npx -y wrangler@4 d1 create fhb; id=$(npx -y wrangler@4 d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).find(x=>x.name==="fhb").uuid))'); fi
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
          sed -i "s|^APP_URL = .*|APP_URL = \"https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}\"|" wrangler.toml
      - name: Create or update the tables
        run: npx -y wrangler@4 d1 execute fhb --remote --file=schema.sql
      - name: Deploy
        run: npx -y wrangler@4 deploy
      - name: Set secret words
        env:
          DASH_KEY: ${{ secrets.DASH_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          [ -n "$DASH_KEY" ] && printf %s "$DASH_KEY" | npx -y wrangler@4 secret put DASH_KEY || echo "No DASH_KEY secret yet: add one in GitHub, then run this again."
          [ -n "$ANTHROPIC_API_KEY" ] && printf %s "$ANTHROPIC_API_KEY" | npx -y wrangler@4 secret put ANTHROPIC_API_KEY || true
