# Tests the village tutor (tutor/): the lesson packs, the hub's Python tests and the app's scripts.
# Runs only when tutor/ changes, so the Sehat app's own workflows are untouched.
name: Tutor
on:
  push:
    branches: [main]
    paths: ["tutor/**", ".github/workflows/tutor.yml"]
  pull_request:
    paths: ["tutor/**", ".github/workflows/tutor.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tutor } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22 }
      - name: Install the PDF maker's system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0
      - name: Install the hub
        run: python3 -m venv .venv && .venv/bin/pip install --quiet -r hub/requirements.txt
      - name: Check the lesson packs
        run: .venv/bin/python tools/validate_pack.py
      - name: Check the module manifests and seed cohorts
        run: .venv/bin/python tools/validate_modules.py
      - name: Hub tests
        working-directory: tutor/hub
        run: ../.venv/bin/python -m pytest -q
      - name: App scripts parse
        # as modules: "node --check file.js" with no package type does not report a module's early errors
        run: for f in app/js/*.js app/js/screens/*.js app/js/modules/*.js app/js/review/*.js app/js/teacher/*.js app/js/admin/*.js app/js/staff/*.js app/js/staff/strings/*.js app/get/*.js; do node --input-type=module --check < "$f" || exit 1; done
      - name: App tests
        run: node --test app/tests/*.test.js
      - name: Staff strings
        run: node tools/check_staff_strings.mjs
  fallback-kit:
    # The fallback kit (BUILD-PLAN P12): the online container builds and passes the smoke test. Never deployed here.
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tutor } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build -f deploy/Dockerfile -t qalam-online .
      - name: Smoke test against the container
        run: |
          docker run -d --name qalam -p 8080:8080 qalam-online
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/api/hello > /dev/null && break; sleep 2; done
          python3 hub/tests/smoke_http.py http://127.0.0.1:8080 || { docker logs qalam; exit 1; }
