# Tests the village tutor (tutor/): the lesson packs, the hub's Python tests and the app's scripts.
# Runs only when tutor/ changes, so the Sehat app's own workflows are untouched.
name: Tutor
on:
  push:
    branches: [main]
    paths: ["tutor/**", ".github/workflows/tutor.yml"]
  pull_request:
    paths: ["tutor/**", ".github/workflows/tutor.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tutor } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22 }
      - name: Install the PDF maker's system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0
      - name: Install the hub
        run: python3 -m venv .venv && .venv/bin/pip install --quiet -r hub/requirements.txt
      - name: Check the lesson packs
        run: .venv/bin/python tools/validate_pack.py
      - name: Check the module manifests and seed cohorts
        run: .venv/bin/python tools/validate_modules.py
      - name: Hub tests
        working-directory: tutor/hub
        run: ../.venv/bin/python -m pytest -q
      - name: App scripts parse
        # as modules: "node --check file.js" with no package type does not report a module's early errors
        run: for f in app/js/*.js app/js/screens/*.js app/js/modules/*.js app/js/review/*.js app/js/teacher/*.js app/js/admin/*.js app/js/staff/*.js app/js/staff/strings/*.js site/js/*.js; do node --input-type=module --check < "$f" || exit 1; done
      - name: App tests
        run: node --test app/tests/*.test.js
      - name: Staff strings
        run: node tools/check_staff_strings.mjs
  site:
    # The website (docs/WEBSITE.md 2.5): rendered and linted by tools/make_site.py, then every page in Dari, Pashto and
    # English at 360 and 1280 px, light and dark, in Chromium: the weight budgets, one request, no other host, 44 px
    # targets, 14 px text, lang, dir and hreflang, the P10 rule, the price tags, throttled first paint and the forwards.
    # Then the move (W2, WEBSITE.md 2.2): the Worker's tree of the last commit before it, then this one, on one address,
    # as a phone with the old app meets it (tools/move_check.mjs), with an online-mode hub behind /api/.
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tutor } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22 }
      - name: Render and lint the website, in the whole tree (the site at /, the app at /app/)
        run: python3 tools/make_site.py --tree "$RUNNER_TEMP/site"
      - name: Install Playwright and its Chromium (pinned)
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx --no-install playwright install --with-deps chromium
      - name: Check the website in a browser
        run: node tools/site_check.mjs --root "$RUNNER_TEMP/site" --out "$RUNNER_TEMP/site-shots"
      - name: The move, as a phone with the old app meets it
        env:
          BEFORE: e42fc68d5c86423784a4eee18ec51e484f2a110a   # the last commit before the move
        run: |
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install --quiet -r deploy/requirements.txt
          git fetch --no-tags --depth=1 origin "$BEFORE"
          mkdir -p "$RUNNER_TEMP/old" && git -C .. archive "$BEFORE:tutor" | tar -x -C "$RUNNER_TEMP/old"
          (cd "$RUNNER_TEMP/old/worker" && "$RUNNER_TEMP/venv/bin/python" -c "import build, pathlib; build.build(pathlib.Path('$RUNNER_TEMP/old-build'))")
          (cd worker && "$RUNNER_TEMP/venv/bin/python" -c "import build, pathlib; build.build(pathlib.Path('$RUNNER_TEMP/new-build'))")
          cd hub
          TUTOR_DATA="$RUNNER_TEMP/hub-data" TUTOR_HOME=online TUTOR_LACKS=printer,pin \
            "$RUNNER_TEMP/venv/bin/python" -m tutor_hub serve --host 127.0.0.1 --port 8001 > "$RUNNER_TEMP/hub.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8001/api/hello > /dev/null && break; sleep 1; done
          cd ..
          node tools/move_check.mjs --old "$RUNNER_TEMP/old-build/public" --new "$RUNNER_TEMP/new-build/public" \
            --hub http://127.0.0.1:8001 --out "$RUNNER_TEMP/site-shots" || { tail -40 "$RUNNER_TEMP/hub.log"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: site-shots
          path: ${{ runner.temp }}/site-shots/
          if-no-files-found: ignore
          retention-days: 14
  fallback-kit:
    # The fallback kit (BUILD-PLAN P12): the online container builds and passes the smoke test. Never deployed here.
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tutor } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build -f deploy/Dockerfile -t qalam-online .
      - name: Smoke test against the container
        run: |
          docker run -d --name qalam -p 8080:8080 qalam-online
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/api/hello > /dev/null && break; sleep 2; done
          python3 hub/tests/smoke_http.py http://127.0.0.1:8080 || { docker logs qalam; exit 1; }
