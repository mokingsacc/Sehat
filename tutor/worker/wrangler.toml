# Qalam online, staging: the hub's FastAPI app as a Cloudflare Python Worker (docs/HOSTING.md).
# .github/workflows/tutor-worker.yml refuses to deploy unless the name and database_name below are both
# "qalam-staging": Sehat's own Worker and database live on the same Cloudflare account and are never touched.
# `python3 build.py` makes build/ first (the hub's code, migrations, manifests, cohorts and lessons; the app and
# pictures as static assets). No migrations_dir: D1Store.open() applies tutor/migrations from inside the Worker,
# and `wrangler d1 migrations apply` must never run against this database (docs/ARCHITECTURE.md).
name = "qalam-staging"
main = "build/src/entry.py"
compatibility_date = "2026-10-01"
compatibility_flags = ["python_workers"]
workers_dev = true
preview_urls = false

[vars]
TUTOR_COHORT = "qg1j2918yx"            # the staging seed cohort (cohorts/staging.json)
TUTOR_AI_PROVIDER = "fake"             # learner-facing AI stays on the fake until a key exists (BUILD-PLAN 3.7)
TUTOR_LACKS = "printer,pin"            # no printer and no teacher PIN online: print and teacher are off here
TUTOR_HOME = "online"                  # learners see the online consent text (OpenAI reads questions), not the hub's
QALAM_SPIKE = "on"                     # staging only: GET /api/_spike answers the P7 questions (entry.py)

# the app and the lesson pictures, served before the Worker; only /api/ reaches Python
[assets]
directory = "build/public"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "qalam-staging"
database_id = "00000000-0000-0000-0000-000000000000"   # set by the deploy job (find or create)

# the lessons, their pictures, the licence records and the migrations travel in the bundle, where the hub's code
# reads them as files (permissions are content/permissions/<id>.md); recorded clips are static assets only
[[rules]]
type = "Data"
globs = ["**/*.json", "**/*.sql", "**/*.svg", "**/*.webp", "**/*.png", "**/*.jpg", "**/*.md"]
fallthrough = false

# no [observability]: Workers Logs stay off, as the hub keeps no access log (CPU time is read live with wrangler tail)
