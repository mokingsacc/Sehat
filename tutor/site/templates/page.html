<!doctype html>
<html lang="{{=hl}}" dir="{{=dir}}" data-l="{{=lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
{{=forward}}<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0d7c7e">
<meta name="referrer" content="no-referrer">
<meta name="description" content="{{=desc}}">
<title>{{=title}}</title>
{{=alternates}}
<link rel="icon" href="{{=favicon}}">{{=manifest}}
<style>{{=css}}</style>
</head>
<body>
{{=sprite}}
<a class="skip" href="#{{=skip_to}}">{{=skip}}</a>
<header class="w top">
 <a class="brand" href="{{=home}}"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0d7c7e"/><path d="M18 46l3-10 21-21a4.2 4.2 0 0 1 6 6L27 42z" fill="none" stroke="#fff" stroke-width="4.5" stroke-linejoin="round"/><path d="M16 50h32" stroke="#f2b134" stroke-width="4.5" stroke-linecap="round"/></svg><span data-t="site.brand"></span></a>
 <span class="chip" id="chip" data-t="site.net_offline" hidden></span>
 <button class="spk" type="button" data-read="{{=read_page}}" aria-label="{{site.hear_page}}"><svg class="i"><use href="#s"/></svg></button>
 <nav class="langs" aria-label="{{site.langs}}">{{=langs}}</nav>
</header>
{{=draft}}
<main id="main">
{{=body}}
</main>
<footer class="w">
 <p data-t="site.foot1"></p>
 <nav><a href="{{=root}}privacy/" data-t="site.privacy"></a><a href="{{=root}}credits/" data-t="site.credits"></a><a href="{{=root}}partners/" data-t="site.about"></a>{{=foot_langs}}</nav>
 <p class="weight" id="weight"></p>
</footer>
<div id="toast" role="status" aria-live="polite"></div>
<script type="application/json" id="t">{{=runtime}}</script>
<script>{{=js}}</script>
</body>
</html>
