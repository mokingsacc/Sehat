plugins {
    id 'com.android.application'
}

// versionName: tutor/android/VERSION. versionCode must grow with every release or phones refuse the update: minutes
// since 2020-01-01 (UTC) at build time, unless VERSION_CODE is set.
def qalamVersion = rootProject.file('VERSION').text.trim()
def minutesSince2020 = (System.currentTimeMillis() - java.time.Instant.parse('2020-01-01T00:00:00Z').toEpochMilli()).intdiv(60000L)
def computedVersionCode = (System.getenv('VERSION_CODE') ?: String.valueOf(minutesSince2020)) as int

// The online home the app talks to when no village hub answers (https only, no path), from QALAM_ONLINE_URL at build
// time; empty means a hub-only app. Not a secret: it is the site's public address.
def onlineUrl = (System.getenv('QALAM_ONLINE_URL') ?: (project.findProperty('QALAM_ONLINE_URL') ?: '')).toString().trim()
if (onlineUrl && !(onlineUrl ==~ /^https:\/\/[A-Za-z0-9.-]+$/)) throw new GradleException("QALAM_ONLINE_URL must be https://host, got: $onlineUrl")

// Release signing comes from environment variables on Mo's machine or a protected CI environment (docs/HOSTING.md,
// "The Android app: signing and Google's verification"). Never from this repository, never Sehat's keys. Without
// them the release build is unsigned (app-release-unsigned.apk).
def secret = { String name -> System.getenv(name) ?: (project.findProperty(name) as String) }
def keystoreFile = secret('QALAM_KEYSTORE_FILE')

android {
    namespace 'org.qalam.app'
    compileSdk 36

    defaultConfig {
        applicationId 'org.qalam.app'
        minSdk 21
        targetSdk 36
        versionCode computedVersionCode
        versionName qalamVersion
        resourceConfigurations += ['en', 'fa', 'ps']
        resValue 'string', 'online_url', onlineUrl
    }

    signingConfigs {
        release {
            if (keystoreFile) {
                storeFile file(keystoreFile)
                storePassword secret('QALAM_KEYSTORE_PASSWORD')
                keyAlias secret('QALAM_KEY_ALIAS')
                keyPassword secret('QALAM_KEY_PASSWORD')
                enableV1Signing true   // Android 5 and 6
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreFile) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // a smaller APK: no Google-only dependency metadata, no stray library files
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
    packaging {
        resources {
            excludes += ['META-INF/*.version', 'META-INF/**/*.version', 'META-INF/*.kotlin_module', 'kotlin/**', 'DebugProbesKt.bin']
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'   // WebViewAssetLoader, service worker interception
    implementation 'androidx.core:core:1.13.1'       // notifications on every Android version
}

// copy the phone app into src/main/assets/www before every build
def syncWeb = tasks.register('syncWeb', Exec) {
    description = 'Copies the phone app (tutor/app, without its tests and staff pages) into the APK assets.'
    commandLine 'bash', rootProject.file('sync-web.sh').absolutePath
    outputs.upToDateWhen { false }
}
tasks.named('preBuild') { dependsOn syncWeb }
